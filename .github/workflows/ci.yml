name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # Not --strict: a pack requires its modules with "*", and the project it
      # is unpacked into writes their real constraints.
      - run: composer validate
      # The modules it names resolve, together, from what is published.
      - run: composer update --no-interaction --no-progress --no-plugins --no-scripts --dry-run
